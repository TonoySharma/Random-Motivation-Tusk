<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Motivation</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <section id="Motivation" class="w-11/12 mx-auto mt-50">
        <div class="justify-center text-center space-y-5 rounded-2xl bg-gray-100 p-16 shadow-xl">

        <h1 class="font-bold text-3xl">Rand<span class="text-red-500">o</span>m Motivati<span class="text-red-500">o</span>n</h1>

         <p id="message" class="mb-8 font-semibold">Click the button to get motivation.</p>

         <div>
            <button id="btn" class="font-bold border cursor-pointer text-white border-gray-300 p-3 px-5 rounded-3xl bg-white bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:shadow-2xl hover:scale-105 hover:from-pink-500 hover:to-blue-500 active:scale-100">Generate Motivation</button>
         </div>
        </div>
    </section>
    <script src="./script.js"></script>
</body>
</html>
